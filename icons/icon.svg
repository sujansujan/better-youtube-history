<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B3B"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="58" rx="28" fill="url(#shine)"/>
  <!-- History circular arc (counter-clockwise arrow) -->
  <path d="M 30 64 A 34 34 0 1 1 42 90" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <!-- Arrowhead on history arc -->
  <polygon points="18,64 41,64 29.5,48" fill="#FFFFFF"/>
  <!-- Play triangle centered -->
  <polygon points="56,47 56,81 86,64" fill="#FFFFFF"/>
</svg>
